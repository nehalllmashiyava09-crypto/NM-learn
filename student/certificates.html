<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="certificates.html">
    <div class="grid-2">
      <div class="card-nm card-pad static" style="background:linear-gradient(135deg,#faf5ff,#eff6ff)">
        <div class="feature-icon"><i class="bi bi-award"></i></div>
        <h3 style="font-size:1.15rem">Digital Marketing Essentials</h3>
        <p>Issued Jul 15, 2026 · QR verified · ID: NM-DM-98421</p>
        <div class="d-flex gap-2">
          <button class="btn-nm btn-primary-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('Certificate PDF downloaded')">Download PDF</button>
          <button class="btn-nm btn-outline-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('QR verification link copied')">Verify QR</button>
        </div>
      </div>
      <div class="card-nm card-pad static">
        <span class="badge-warning badge-nm">In progress · 34%</span>
        <h3 class="mt-2" style="font-size:1.15rem">Complete Full Stack Web Development Bootcamp</h3>
        <p style="font-size:.9rem">Requirements: 100% chapters · all assignments · pass monthly exams · final project · 60%+ overall</p>
        <div class="progress-nm mb-3"><span style="width:34%"></span></div>
        <a class="btn-nm btn-outline-nm btn-sm-nm" href="course-detail.html">Continue course</a>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
