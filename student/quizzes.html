<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzes | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="quizzes.html">
    <div class="grid-2">
      <div class="card-nm card-pad static"><span class="badge-nm">Available</span><h3 class="mt-2" style="font-size:1.05rem">Flexbox Quick Quiz</h3><p>10 questions · 15 minutes · Web Development</p><button class="btn-nm btn-primary-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('Quiz started (demo)')">Attempt quiz</button></div>
      <div class="card-nm card-pad static"><span class="badge-success badge-nm">Completed</span><h3 class="mt-2" style="font-size:1.05rem">AI Basics Check</h3><p>Score: 88% · Instant results enabled</p><button class="btn-nm btn-outline-nm btn-sm-nm" type="button">View results</button></div>
      <div class="card-nm card-pad static"><span class="badge-warning badge-nm">Locked</span><h3 class="mt-2" style="font-size:1.05rem">CSS Grid Quiz</h3><p>Unlocks after Lesson 19</p><button class="btn-nm btn-outline-nm btn-sm-nm" disabled>Locked</button></div>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
