<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="profile.html">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="card-nm card-pad static text-center">
          <div class="avatar mx-auto mb-3" style="width:84px;height:84px;font-size:1.5rem" id="profileAvatar">ST</div>
          <h2 style="font-size:1.2rem" id="profileName">Student</h2>
          <p id="profileEmail" style="font-size:.9rem">student@email.com</p>
          <button class="btn-nm btn-outline-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('Photo upload ready (demo)')">Change photo</button>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card-nm card-pad static mb-3">
          <h3 style="font-size:1.05rem">Personal information</h3>
          <form class="row g-3" onsubmit="event.preventDefault(); NMLearn.showToast('Profile updated')">
            <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" id="nameInput" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="emailInput" type="email" required></div>
            <div class="col-md-6"><label class="form-label">Timezone</label><select class="form-select"><option>Asia/Kolkata (IST)</option></select></div>
            <div class="col-md-6"><label class="form-label">Language</label><select class="form-select"><option>English</option><option>Hindi</option></select></div>
            <div class="col-12"><button class="btn-nm btn-primary-nm btn-sm-nm" type="submit">Save changes</button></div>
          </form>
        </div>
        <div class="card-nm card-pad static mb-3">
          <h3 style="font-size:1.05rem">Change password</h3>
          <form class="row g-3" onsubmit="event.preventDefault(); NMLearn.showToast('Password updated securely')">
            <div class="col-md-4"><label class="form-label">Current</label><input class="form-control" type="password" required></div>
            <div class="col-md-4"><label class="form-label">New</label><input class="form-control" type="password" minlength="8" required></div>
            <div class="col-md-4"><label class="form-label">Confirm</label><input class="form-control" type="password" minlength="8" required></div>
            <div class="col-12"><button class="btn-nm btn-outline-nm btn-sm-nm" type="submit">Update password</button></div>
          </form>
        </div>
        <div class="card-nm card-pad static">
          <h3 style="font-size:1.05rem">Notification preferences</h3>
          <label class="d-flex gap-2 mb-2"><input type="checkbox" checked> Live class reminders</label>
          <label class="d-flex gap-2 mb-2"><input type="checkbox" checked> Assignment deadlines</label>
          <label class="d-flex gap-2 mb-2"><input type="checkbox" checked> Exam schedules</label>
          <label class="d-flex gap-2"><input type="checkbox"> Weekly learning summary</label>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = NMLearn.getSession();
      if (!s) return;
      document.getElementById('profileAvatar').textContent = s.initials;
      document.getElementById('profileName').textContent = s.name;
      document.getElementById('profileEmail').textContent = s.email;
      document.getElementById('nameInput').value = s.name;
      document.getElementById('emailInput').value = s.email;
    });
  </script>
</body>
</html>
