<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="attendance.html">
    <div class="grid-3 mb-3">
      <div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">Overall</div><div class="value">91%</div></div>
      <div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">Live classes joined</div><div class="value">22</div></div>
      <div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">Missed</div><div class="value">2</div></div>
    </div>
    <div class="table-wrap">
      <table class="table-nm">
        <thead><tr><th>Date</th><th>Session</th><th>Course</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>Aug 1, 2026</td><td>JS Debugging Lab</td><td>Web Development</td><td><span class="badge-success badge-nm">Present</span></td></tr>
          <tr><td>Jul 28, 2026</td><td>AI Office Hours</td><td>AI Fundamentals</td><td><span class="badge-success badge-nm">Present</span></td></tr>
          <tr><td>Jul 21, 2026</td><td>Layout Workshop</td><td>Web Development</td><td><span class="badge-danger badge-nm">Absent</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
