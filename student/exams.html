<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Exams · Full Stack Bootcamp | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/course.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="exams.html">
    <p class="mb-3">Monthly assessments for the Full Stack Web Development Bootcamp.</p>
    <div class="grid-3 mb-3">
      <div class="card-nm card-pad static">
        <span class="badge-success badge-nm">Passed</span>
        <h3 class="mt-2" style="font-size:1.05rem">Month 1 Exam</h3>
        <p style="font-size:.9rem">50 MCQs · Practical coding test · Viva (Teacher)</p>
        <strong>Score: 81%</strong>
        <div class="mt-2"><button class="btn-nm btn-outline-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('Scorecard downloaded')">Download scorecard</button></div>
      </div>
      <div class="card-nm card-pad static">
        <span class="badge-warning badge-nm">Upcoming</span>
        <h3 class="mt-2" style="font-size:1.05rem">Month 2 Exam</h3>
        <p style="font-size:.9rem">25 MCQs + 5 descriptive · Mini project assessment</p>
        <div style="font-family:var(--display);font-size:1.5rem;font-weight:800">12d left</div>
        <a class="btn-nm btn-primary-nm btn-sm-nm mt-2" href="exam-take.html">Start exam (30 questions)</a>
      </div>
      <div class="card-nm card-pad static">
        <span class="badge-nm">Later</span>
        <h3 class="mt-2" style="font-size:1.05rem">Month 3 Exam</h3>
        <p style="font-size:.9rem">Full Project review</p>
        <button class="btn-nm btn-outline-nm btn-sm-nm" disabled>Locked</button>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
