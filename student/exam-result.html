<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/course.css">
</head>
<body>
  <div id="app-shell" data-role="student" data-page="exams.html">
    <div class="card-nm card-pad static text-center" style="max-width:640px;margin:0 auto">
      <div class="feature-icon mx-auto"><i class="bi bi-clipboard2-check"></i></div>
      <h1 style="font-size:1.6rem">Exam submitted</h1>
      <p>Full Stack Bootcamp · Month 2 assessment result</p>
      <div style="font-family:var(--display);font-size:3rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;color:transparent" id="scorePct">—</div>
      <div class="progress-stats mt-3 mb-3" style="text-align:left">
        <div class="progress-stat">MCQ correct<strong id="mcqScore">—</strong></div>
        <div class="progress-stat">Questions answered<strong id="answered">—</strong></div>
        <div class="progress-stat">Descriptive<strong>Sent for teacher review</strong></div>
        <div class="progress-stat">Status<strong id="passStatus">—</strong></div>
      </div>
      <div class="d-flex flex-wrap justify-content-center gap-2">
        <button class="btn-nm btn-outline-nm btn-sm-nm" type="button" onclick="NMLearn.showToast('Scorecard PDF downloaded')">Download scorecard</button>
        <a class="btn-nm btn-primary-nm btn-sm-nm" href="exams.html">Back to exams</a>
        <a class="btn-nm btn-outline-nm btn-sm-nm" href="course-detail.html">Course home</a>
      </div>
    </div>
  </div>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const r = JSON.parse(localStorage.getItem('nmlearn_exam_result') || '{}');
        if (!r.percent && r.percent !== 0) return;
        document.getElementById('scorePct').textContent = r.percent + '%';
        document.getElementById('mcqScore').textContent = r.score + ' / ' + r.mcqTotal;
        document.getElementById('answered').textContent = r.answered + ' / ' + r.total;
        document.getElementById('passStatus').textContent = r.percent >= 60 ? 'Passed' : 'Needs improvement';
      } catch (e) {}
    });
  </script>
</body>
</html>
