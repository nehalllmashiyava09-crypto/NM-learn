<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | NM Learn</title>
  <meta name="description" content="Create your NM Learn student account to access courses, live classes, notes, exams, and certificates.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card wide">
      <a class="brand mb-4 d-inline-flex" href="index.html">
        <span class="brand-mark">NM</span>
        <span><strong>NM Learn</strong><small>Student Registration</small></span>
      </a>
      <h1 style="font-size:1.6rem">Create your student account</h1>
      <p>Join a secure, distraction-free learning environment.</p>
      <form id="registerForm" class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" name="name" required autocomplete="name">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="confirm">Confirm password</label>
          <input class="form-control" type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
        </div>
        <div class="col-12">
          <label class="d-flex gap-2 align-items-start" style="font-size:.88rem">
            <input type="checkbox" required style="margin-top:.25rem">
            <span>I agree to learn respectfully and understand that only teachers can host live sessions.</span>
          </label>
        </div>
        <div class="col-12">
          <button class="btn-nm btn-primary-nm btn-block" type="submit">Create account</button>
        </div>
      </form>
      <p class="mt-3 mb-0 text-center" style="font-size:.9rem">Already registered? <a href="login.html"><strong>Log in</strong></a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
