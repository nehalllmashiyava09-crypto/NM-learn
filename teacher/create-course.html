<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Course | Teacher | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="app-shell" data-role="teacher" data-page="create-course.html">
    <div class="card-nm card-pad static">
      <h1 style="font-size:1.35rem">Create / manage course content</h1>
      <form class="row g-3" onsubmit="event.preventDefault(); NMLearn.showToast('Course saved (demo)')">
        <div class="col-md-8"><label class="form-label">Course title</label><input class="form-control" required placeholder="e.g. Full-Stack Web Development"></div>
        <div class="col-md-4"><label class="form-label">Category</label><select class="form-select"><option>Programming</option><option>Technology & AI</option><option>Digital Marketing</option><option>Design</option><option>Business</option></select></div>
        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" required></textarea></div>
        <div class="col-md-4"><label class="form-label">Thumbnail</label><input class="form-control" type="file" accept="image/*"></div>
        <div class="col-md-4"><label class="form-label">Upload video lecture</label><input class="form-control" type="file" accept="video/*"></div>
        <div class="col-md-4"><label class="form-label">Upload PDF / notes</label><input class="form-control" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx"></div>
        <div class="col-12"><button class="btn-nm btn-primary-nm" type="submit">Save course content</button></div>
      </form>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
