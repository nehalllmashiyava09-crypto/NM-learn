<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | NM Learn</title>
  <meta name="description" content="Secure login to NM Learn for students, teachers, and administrators.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand mb-4 d-inline-flex" href="index.html">
        <span class="brand-mark">NM</span>
        <span><strong>NM Learn</strong><small>Secure Login</small></span>
      </a>
      <h1 style="font-size:1.6rem">Welcome back</h1>
      <p>Sign in to continue learning in a secure environment.</p>
      <form id="loginForm" class="row g-3 mt-1">
        <div class="col-12">
          <label class="form-label" for="role">I am a</label>
          <select class="form-select" id="role" name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required placeholder="you@email.com" autocomplete="username">
        </div>
        <div class="col-12">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required minlength="8" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="col-12 d-flex justify-content-between align-items-center">
          <label class="d-flex align-items-center gap-2" style="font-size:.88rem;font-weight:600"><input type="checkbox"> Remember me</label>
          <a href="forgot-password.html" style="font-size:.88rem;font-weight:700">Forgot password?</a>
        </div>
        <div class="col-12">
          <button class="btn-nm btn-primary-nm btn-block" type="submit">Log in securely</button>
        </div>
      </form>
      <p class="mt-3 mb-0 text-center" style="font-size:.9rem">New student? <a href="register.html"><strong>Create an account</strong></a></p>
      <p class="mt-2 mb-0 text-center" style="font-size:.78rem;color:var(--muted)">Demo: any email/password (8+ chars). Role selects your portal.</p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
