<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a class="brand mb-4 d-inline-flex" href="index.html"><span class="brand-mark">NM</span><span><strong>NM Learn</strong><small>Password Reset</small></span></a>
      <h1 style="font-size:1.5rem">Forgot your password?</h1>
      <p>Enter your account email. We’ll send a secure reset link (demo flow).</p>
      <form class="row g-3" onsubmit="event.preventDefault(); NMLearn.showToast('Reset link sent (demo).'); setTimeout(()=>location.href='login.html',900)">
        <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" required></div>
        <div class="col-12"><button class="btn-nm btn-primary-nm btn-block" type="submit">Send reset link</button></div>
      </form>
      <p class="mt-3 mb-0 text-center"><a href="login.html">Back to login</a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
