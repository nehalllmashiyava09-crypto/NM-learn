<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics | NM Learn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
  <div id="app-shell" data-role="admin" data-page="analytics.html">
    <div class="grid-3 mb-3"><div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">DAU</div><div class="value">612</div></div><div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">Avg watch time</div><div class="value">38m</div></div><div class="card-nm card-pad static stat-card"><div style="font-size:.82rem;color:var(--muted);font-weight:700">Exam pass rate</div><div class="value">84%</div></div></div><div class="card-nm card-pad static"><h2 style="font-size:1.1rem">Learning analytics</h2><p>Track engagement, live attendance, assignment submission rates, and certificate conversions across the platform.</p><div class="progress-nm mb-2"><span style="width:84%"></span></div><small style="color:var(--muted)">Monthly exam pass rate</small></div>
  </div>
  <script src="../js/main.js"></script>

</html>
